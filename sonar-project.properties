sonar.projectKey=knygnesys-homework
sonar.projectName=Knygnesys code-quality homework
sonar.projectVersion=baseline
sonar.sourceEncoding=UTF-8
sonar.sources=knygnesys-app/src/main/java,knygnesys-ui/src
sonar.tests=knygnesys-app/src/test/java
sonar.exclusions=**/*.spec.ts
sonar.java.source=21
sonar.java.binaries=knygnesys-app/target/classes
sonar.java.libraries=knygnesys-app/target/sonar-dependencies/*.jar
sonar.java.test.binaries=knygnesys-app/target/test-classes
sonar.java.test.libraries=knygnesys-app/target/sonar-dependencies/*.jar
sonar.junit.reportPaths=knygnesys-app/target/surefire-reports
sonar.typescript.tsconfigPaths=knygnesys-ui/tsconfig.app.json
# No coverage report is imported: passing tests are not a coverage measurement.
# Excluded Angular spec files were tested separately with Vitest.
# Set SONAR_HOST_URL and SONAR_TOKEN in the environment; never put tokens here.
