<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h2 class="mb-4">Registracija</h2>

      @if (error) {
        <div class="alert alert-danger">{{ error }}</div>
      }

      <div class="mb-3">
        <label class="form-label">El. paštas</label>
        <input type="email" class="form-control" [(ngModel)]="email"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Vartotojo vardas</label>
        <input type="text" class="form-control" [(ngModel)]="username"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Slaptažodis</label>
        <input type="password" class="form-control" [(ngModel)]="password"/>
      </div>
      <button class="btn btn-primary w-100" (click)="register()">Registruotis</button>
      <p class="mt-3 text-center">
        Jau turi paskyrą? <a routerLink="/login">Prisijungti</a>
      </p>
    </div>
  </div>
</div>
